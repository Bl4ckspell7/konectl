name: Package

# Builds the release packages: a tarball with the binaries (on Debian 12, so
# it runs on distributions with glibc 2.36 or newer) and a Flatpak bundle of
# the GUI. Runs on pull requests to catch packaging problems, and from the
# release workflow, which attaches the files to the GitHub release.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to package (the release tag)"
        type: string
        required: true
      version:
        description: "Version in the file names"
        type: string
        required: true

concurrency:
  group: package-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  tarball:
    name: Linux binaries
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1.100.0-slim-bookworm@sha256:bb875b0f8ce726053e259034848c471840e96bfe591fd52556178ae9a05e6126

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          # The GUI (Slint) links fontconfig; hidapi needs libudev.
          apt-get install -y --no-install-recommends git libfontconfig-dev libudev-dev pkg-config

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build
        run: cargo build --release --locked -p konectl-cli -p konectl-gui

      - name: Pack
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: bash scripts/release/tarball.sh "$VERSION"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: dist/*.tar.gz*
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    # flathub-infra tags its images by runtime branch only; the digest pins
    # the exact image.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The Flatpak build runs offline: every crate in Cargo.lock becomes a
      # source of the manifest.
      - name: Generate the crate sources
        run: uvx --from 'flatpak-cargo-generator==0.1.5' flatpak-cargo-generator Cargo.lock -o cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.bl4ckspell7.konectl.yml
          bundle: konectl-${{ inputs.version || 'dev' }}.flatpak
          branch: stable
          upload-artifact: true

      # Advisory: --device=all (needed for /dev/hidraw*) is always flagged.
      - name: Lint Flatpak manifest
        continue-on-error: true
        run: flatpak-builder-lint manifest io.github.bl4ckspell7.konectl.yml

      - name: Lint Flatpak repo
        continue-on-error: true
        run: flatpak-builder-lint repo repo
