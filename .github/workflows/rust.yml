name: Rust

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /usr/local/cargo

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-20261108.0.623074@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899

    steps:
      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ github.run_id }}
          restore-keys: pacman-

      - name: Install dependencies
        run: |
          pacman-key --init
          # fontconfig, freetype2: the GUI (Slint) links them.
          pacman -Syu --noconfirm fontconfig freetype2 git pkgconf rust shellcheck systemd-libs
          # Keep only the installed package versions, so the cache does not grow.
          pacman -Sc --noconfirm

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Rust version
        id: rustc
        run: echo "hash=$(rustc -V | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          # A new rustc cannot reuse old build output, so it is part of the key.
          key: ${{ runner.os }}-cargo-${{ steps.rustc.outputs.hash }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rustc.outputs.hash }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check shell scripts
        run: shellcheck tools/re/*.sh scripts/release/*.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-20261108.0.623074@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899

    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          # gcc: hidapi compiles C code and rustup's toolchains link with it (Arch's rust
          # package pulls it in itself).
          pacman -Syu --noconfirm fontconfig freetype2 gcc git pkgconf rustup systemd-libs

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The library and the CLI share the workspace's version; the GUI needs a
      # newer one (Slint).
      - name: Install the minimum Rust versions
        id: msrv
        run: |
          set -euo pipefail
          workspace="$(sed -nE 's/^rust-version = "([^"]+)"/\1/p' Cargo.toml)"
          gui="$(sed -nE 's/^rust-version = "([^"]+)"/\1/p' crates/konectl-gui/Cargo.toml)"
          rustup toolchain install "$workspace" "$gui" --profile minimal
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "gui=$gui" >> "$GITHUB_OUTPUT"

      - name: Check the library and the CLI
        env:
          TOOLCHAIN: ${{ steps.msrv.outputs.workspace }}
        run: cargo "+$TOOLCHAIN" check -p konectl -p konectl-cli --all-targets --locked

      - name: Check the GUI
        env:
          TOOLCHAIN: ${{ steps.msrv.outputs.gui }}
        run: cargo "+$TOOLCHAIN" check -p konectl-gui --all-targets --all-features --locked
