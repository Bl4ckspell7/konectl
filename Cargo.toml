[workspace]
resolver = "3"
members = ["crates/konectl", "crates/konectl-cli", "crates/konectl-gui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Bl4ckspell7/konectl"
keywords = ["roccat", "kone", "mouse", "hidraw", "hid"]

[workspace.dependencies]
konectl = { path = "crates/konectl", version = "0.3.0" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
# Without regex filters: RUST_LOG takes module names and levels.
env_logger = { version = "0.11.12", default-features = false, features = ["auto-color", "humantime"] }
hidapi = "2.6.7"
log = "0.4.35"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
